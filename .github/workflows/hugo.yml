name: Deploy Hugo site to GitHub Pages

# 只有在你决定用 GitHub Pages 托管时才需要这个文件。
# 用 Cloudflare Pages / Netlify / Vercel 的话可以把它删掉（它们自己在控制台里配置构建）。
#
# 前置操作（只需一次）：
#   仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"
#   若使用自定义域名，在 Settings → Pages → Custom domain 里填好（会自动申请 HTTPS 证书）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时间只跑一个部署，新的推送取消排队中的旧任务（但不打断正在进行的部署）
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 站点要求：PaperMod ≥ 0.146，hugo.toml 里的 locale 需要 ≥ 0.158，这里与本地保持一致
      HUGO_VERSION: 0.167.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # 主题 themes/PaperMod 是 git submodule，必须递归拉取
          fetch-depth: 0          # PaperMod 需要完整的提交历史来计算 .Lastmod / .GitInfo

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        # --baseURL 由 configure-pages 提供：
        #   用户站点  → https://<user>.github.io/
        #   项目站点  → https://<user>.github.io/<repo>/
        # 这样即使 hugo.toml 里的 baseURL 忘改，线上链接也是对的。
        run: hugo --minify --gc --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
