<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LUCENT // VINYL 4K</title>
  <style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
:root{--ice:#e8f3ff;--cy:#4fd8ff;--vi:#9a7bff;--ro:#ff5c93;--mut:#8da2c8}
body{background:#080a16;color:var(--ice);font-family:"Helvetica Neue","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-weight:300;overflow:hidden;height:100vh;width:100vw}
#gameCanvas{display:block;width:100%;height:100%}
.scr{position:fixed;inset:0;z-index:20;display:none;animation:in .5s ease}
@keyframes in{from{opacity:0}to{opacity:1}}
body[data-screen=title] #sTitle,body[data-screen=select] #sSelect,body[data-screen=result] #sResult{display:flex}
/* 主界面 */
#sTitle{flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:11vh;text-align:center;cursor:pointer}
#sTitle h1{font-size:clamp(44px,10vw,96px);font-weight:100;letter-spacing:.38em;margin-right:-.38em}
#sTitle p{color:var(--mut);letter-spacing:.3em;font-size:12px;margin-top:6px}
#sTitle .go{margin-top:6vh;font-size:14px;letter-spacing:.35em;animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
/* 选曲 / 结算 */
#sSelect,#sResult{align-items:center;justify-content:flex-end;padding:0 7vw}
.panel{width:min(480px,100%);display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:clamp(30px,4vw,44px);font-weight:200;letter-spacing:.08em}
.hint{font-size:12px;color:var(--mut);line-height:1.7;word-break:break-all}
.diffs{display:flex;flex-direction:column;gap:8px}
.diff-btn{--c:var(--cy);display:flex;justify-content:space-between;align-items:baseline;padding:14px 22px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:rgba(10,14,34,.6);color:var(--c);transform:skewX(-10deg);cursor:pointer;font:inherit;font-size:20px;letter-spacing:.14em;transition:background .2s,color .2s}
.diff-btn span{font-size:13px;letter-spacing:.2em;opacity:.8}
.diff-btn[data-diff=expert]{--c:var(--vi)}
.diff-btn[data-diff=master]{--c:var(--ro)}
.diff-btn.active{background:var(--c);color:#080a16;box-shadow:0 0 28px color-mix(in srgb,var(--c) 50%,transparent)}
.tools{display:flex;gap:8px}
.tool{flex:1;padding:10px;border:1px solid rgba(190,220,255,.25);font-size:12px;text-align:center;cursor:pointer;letter-spacing:.1em}
.tool:hover{background:rgba(190,220,255,.1)}
.spd{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut)}
.spd input{flex:1;accent-color:var(--cy);cursor:pointer}
.row{display:flex;gap:10px}
.btn{flex:1;padding:16px 30px;border:0;background:var(--ice);color:#080a16;font:inherit;font-weight:500;font-size:17px;letter-spacing:.3em;transform:skewX(-10deg);cursor:pointer;box-shadow:0 0 30px rgba(120,200,255,.35)}
.btn.ghost{flex:0 0 auto;background:transparent;color:var(--ice);border:1px solid rgba(190,220,255,.35);box-shadow:none;padding:16px 22px;font-size:14px;letter-spacing:.15em}
.btn:disabled{opacity:.4}
input[type=file]{display:none}
@media(max-width:759px){#sSelect,#sResult{justify-content:center;align-items:flex-end;padding:0 5vw 4vh}}
/* 游玩 HUD */
#hud{display:none;position:fixed;inset:14px 20px auto;justify-content:space-between;align-items:flex-start;z-index:10;pointer-events:none}
body[data-screen=play] #hud{display:flex}
#prog{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cy),var(--vi));transform-origin:left;transform:scaleX(0)}
#quitBtn{pointer-events:auto;background:none;border:1px solid rgba(190,220,255,.3);color:var(--ice);width:32px;height:32px;margin-bottom:8px;cursor:pointer;border-radius:50%}
#trackTitleDisplay{font-size:13px;color:var(--mut);letter-spacing:.12em;max-width:44vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{text-align:right}
#scoreVal{font-size:34px;font-weight:200;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.hr .sub{font-size:12px;color:var(--mut);display:flex;gap:14px;justify-content:flex-end}
#feverBadge{color:var(--ro)}
/* 结算卡 */
#resultCard{display:none}
.rank-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid rgba(190,220,255,.2)}
.rank-tag{display:inline-block;font-size:12px;letter-spacing:.15em;padding:3px 10px;margin-bottom:6px}
.rank-tag.ap{background:linear-gradient(90deg,var(--cy),var(--vi),var(--ro));color:#080a16}
.rank-tag.fc{background:var(--cy);color:#080a16}
.rank-tag.clear{border:1px solid rgba(190,220,255,.4)}
#resTotalScore{font-size:38px;font-weight:200;font-variant-numeric:tabular-nums}
#resSubTitle{font-size:12px;color:var(--mut)}
.rank-letter{font-size:64px;font-weight:100;line-height:1;text-shadow:0 0 24px rgba(120,200,255,.6)}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:12px;font-size:13px}
.res-item{display:flex;justify-content:space-between;padding:6px 10px;background:rgba(10,14,34,.55);border-left:2px solid currentColor}
</style>
</head>
<body data-screen="title">

  <div id="hud">
  <div id="prog"></div>
  <div><button id="quitBtn" aria-label="退出">✕</button><div id="trackTitleDisplay">♪ Lucent</div></div>
  <div class="hr"><div id="scoreVal">0000000</div><div class="sub"><span id="accVal">100.00%</span><span id="feverBadge">FEVER (0/25)</span></div></div>
</div>

<canvas id="gameCanvas"></canvas>

<section class="scr" id="sTitle">
  <h1>LUCENT</h1>
  <p>VINYL 4K</p>
  <div class="go">点击屏幕开始</div>
</section>

<section class="scr" id="sSelect">
  <div class="panel">
    <h2 id="selName">Lucent</h2>
    <div class="hint"><span id="statusText">内置原曲，自动读取 MP3 内嵌封面</span><br><span id="selectedFileName">当前曲目：Lucent.mp3</span></div>
    <div class="diffs">
      <button class="diff-btn" data-diff="hard">HARD <span>进阶</span></button>
      <button class="diff-btn active" data-diff="expert">EXPERT <span>专家</span></button>
      <button class="diff-btn" data-diff="master">MASTER <span>魔王</span></button>
    </div>
    <div class="tools">
      <label for="audioFileInput" class="tool">导入 MP3</label><input type="file" id="audioFileInput" accept="audio/*" />
      <label for="coverFileInput" class="tool">更换封面</label><input type="file" id="coverFileInput" accept="image/*" />
    </div>
    <div class="spd"><span>流速</span><input type="range" id="speedSlider" min="0.7" max="1.3" step="0.05" value="1.0" /><span id="speedValLabel">1.00x</span></div>
    <div class="row"><button class="btn ghost" id="backBtn">返回</button><button class="btn" id="startBtn">开始演奏</button></div>
    <div class="hint">键盘 D F J K，或直接点按、按住屏幕下方的 4 条轨道。Esc 退出。</div>
  </div>
</section>

<section class="scr" id="sResult">
  <div class="panel">
    <div id="resultCard">
      <div class="rank-header">
        <div>
          <div class="rank-tag ap" id="clearBanner"></div>
          <div id="resTotalScore">0</div>
          <div id="resSubTitle"></div>
        </div>
        <div class="rank-letter" id="resRankLetter">S</div>
      </div>
      <div class="result-grid">
        <div class="res-item" style="color:#7afcff"><span>PERFECT</span><span id="resPerf">0</span></div>
        <div class="res-item" style="color:#ffd166"><span>GREAT</span><span id="resGreat">0</span></div>
        <div class="res-item" style="color:#c77dff"><span>GOOD</span><span id="resGood">0</span></div>
        <div class="res-item" style="color:#ff5964"><span>MISS</span><span id="resMiss">0</span></div>
      </div>
    </div>
    <div class="row"><button class="btn ghost" id="toSelBtn">选曲</button><button class="btn" id="againBtn">再来一次</button></div>
  </div>
</section>

    expert: { speed: 820, minGap: 0.125, sensitivity: 1.10, holdProb: 0.30, chordProb: 0.32, jackProb: 0.22 },

    } else if (width >= 760) {

    } else {

  // Base64 转 ArrayBuffer 解码内嵌的 Lucent.mp3
  function base64ToArrayBuffer(base64) {
    const binaryString = atob(base64);
    const len = binaryString.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      bytes[i] = binaryString.charCodeAt(i);
    }
    return bytes.buffer;
  }

  // 解析任意 MP3 文件中的 ID3v2 APIC 内嵌专辑封面
  function extractID3CoverUrl(arrayBuffer) {
    try {
      const data = new Uint8Array(arrayBuffer);
      if (data.length < 10 || data[0] !== 0x49 || data[1] !== 0x44 || data[2] !== 0x33) return null;
      const version = data[3];
      const tagSize = ((data[6] & 0x7f) << 21) | ((data[7] & 0x7f) << 14) | ((data[8] & 0x7f) << 7) | (data[9] & 0x7f);
      let pos = 10;
      const end = Math.min(data.length, 10 + tagSize);

      while (pos + 10 <= end) {
        const id = String.fromCharCode(data[pos], data[pos+1], data[pos+2], data[pos+3]);
        if (id === '\0\0\0\0') break;
        const fsize = version === 4
          ? (((data[pos+4] & 0x7f) << 21) | ((data[pos+5] & 0x7f) << 14) | ((data[pos+6] & 0x7f) << 7) | (data[pos+7] & 0x7f))
          : ((data[pos+4] << 24) | (data[pos+5] << 16) | (data[pos+6] << 8) | data[pos+7]) >>> 0;

        if (id === 'APIC' && pos + 10 + fsize <= end) {
          const frame = data.subarray(pos + 10, pos + 10 + fsize);
          const enc = frame[0];
          let mimeEnd = 1;
          while (mimeEnd < frame.length && frame[mimeEnd] !== 0) mimeEnd++;
          const mime = String.fromCharCode(...frame.subarray(1, mimeEnd)) || 'image/jpeg';
          let idx = mimeEnd + 2; // 跳过 null 和 pictureType
          if (enc === 1 || enc === 2) {
            while (idx + 1 < frame.length && !(frame[idx] === 0 && frame[idx + 1] === 0)) idx += 2;
            idx += 2;
          } else {
            while (idx < frame.length && frame[idx] !== 0) idx++;
            idx += 1;
          }
          const imgBytes = frame.subarray(idx);
          const blob = new Blob([imgBytes], { type: mime });
          return URL.createObjectURL(blob);
        }
        pos += 10 + fsize;
      }
    } catch (e) {}
    return null;
  }

  async function ensureAudioDecoded() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    if (!activeAudioBuffer) {
      if (!presetAudioBuffer) {
        const resp = await fetch(PRESET_MP3_URL); const rawBuf = await resp.arrayBuffer();
        presetAudioBuffer = await audioCtx.decodeAudioData(rawBuf);
      }
      activeAudioBuffer = presetAudioBuffer;
    }
  }

  // 导入其他 MP3 时自动提取其内嵌 ID3 专辑封面并更换唱片图案

  // ==========================================
  // 高密度多维频段谱面生成器
  // ==========================================
  function generateHighDensityChart(buffer, diff) {
    const sampleRate = buffer.sampleRate;
    const channelData = buffer.getChannelData(0);
    const totalSamples = channelData.length;

    const hopSize = Math.floor(sampleRate * 0.01);
    const energies = [];

    for (let i = 0; i < totalSamples; i += hopSize) {
      let sum = 0;
      const end = Math.min(i + hopSize, totalSamples);
      for (let j = i; j < end; j++) {
        sum += channelData[j] * channelData[j];
      }
      energies.push(Math.sqrt(sum / (end - i)));
    }

    const cfg = DIFF_CONFIG[diff];
    const generated = [];
    const windowRadius = 24;
    let lastNoteTime = 1.4;
    let lastLane = -1;
    let secondLastLane = -1;
    let trillDirection = 1;

    for (let i = windowRadius; i < energies.length - windowRadius; i++) {
      const time = i * 0.01;
      if (time < 1.5 || time > buffer.duration - 1.5) continue;
      if (time - lastNoteTime < cfg.minGap) continue;

      let localSum = 0;
      for (let k = i - windowRadius; k <= i + windowRadius; k++) {
        localSum += energies[k];
      }
      const localAvg = localSum / (windowRadius * 2 + 1);
      const curr = energies[i];

      if (curr > 0.022 && curr > localAvg * cfg.sensitivity && curr >= energies[i - 1] && curr >= energies[i + 1]) {
        const ratio = curr / (localAvg + 0.0001);

        let lane = 0;
        if (Math.random() < cfg.jackProb && lastLane !== -1 && lastLane !== secondLastLane) {
          lane = lastLane;
        } else {
          if (Math.random() < 0.65 && lastLane !== -1) {
            lane = (lastLane + trillDirection + LANES) % LANES;
            if (lane === 0 || lane === LANES - 1) trillDirection *= -1;
          } else {
            const candidates = [0, 1, 2, 3].filter(l => l !== lastLane);
            lane = candidates[Math.floor(Math.random() * candidates.length)];
          }
        }

        let holdDuration = 0;
        if (ratio > cfg.sensitivity + 0.22 && Math.random() < cfg.holdProb) {
          holdDuration = Number((0.26 + Math.random() * 0.34).toFixed(2));
        }

        generated.push({
          time,
          lane,
          duration: holdDuration,
          hit: false,
          holding: false,
          missed: false
        });

        if (ratio > cfg.sensitivity + 0.28 && Math.random() < cfg.chordProb && holdDuration === 0) {
          const offset = (lane <= 1) ? 2 : -2;
          const chordLane = (lane + offset + LANES) % LANES;
          generated.push({
            time,
            lane: chordLane,
            duration: 0,
            hit: false,
            holding: false,
            missed: false
          });
        }

        secondLastLane = lastLane;
        lastLane = lane;
        lastNoteTime = time + holdDuration * 0.85;
      }
    }

    return generated;
  }

  function triggerHitSound(lane) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(980 + lane * 140, now);
    osc.frequency.exponentialRampToValueAtTime(320, now + 0.035);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.045);
  }

  // ==========================================
  // 游戏启动与华丽通关结算
  // ==========================================
  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    startBtn.textContent = '读取中…';

      score = 0;
      combo = 0;
      maxCombo = 0;
      stats = { perfect: 0, great: 0, good: 0, miss: 0 };
      particles = [];
      shockwaves = [];
      confetti = [];

      notes = generateHighDensityChart(activeAudioBuffer, difficulty);
      songDuration = activeAudioBuffer.duration + 1.2;
      trackTitleDisplay.textContent = `♪ ${currentTrackName} [${difficulty.toUpperCase()}]`;

      startTime = audioCtx.currentTime + 0.35;
      const source = audioCtx.createBufferSource();
      source.buffer = activeAudioBuffer;

  function spawnCelebrationConfetti() {
    const colors = ['#ffd166', '#7afcff', '#ff7eb3', '#ffffff', '#c77dff'];
    for (let i = 0; i < 110; i++) {
      confetti.push({
        x: width * (0.2 + Math.random() * 0.6),
        y: height * 0.45,
        vx: (Math.random() - 0.5) * 680,
        vy: -220 - Math.random() * 480,
        w: 6 + Math.random() * 6,
        h: 4 + Math.random() * 4,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 12,
        color: colors[i % colors.length],
        alpha: 1
      });
    }
  }

  function endGame() {
    isPlaying = false;
    if (activeSourceNode) {
      try { activeSourceNode.stop(); } catch (e) {}
    }

    const total = stats.perfect + stats.great + stats.good + stats.miss;
    const accNum = total > 0
      ? ((stats.perfect * 1 + stats.great * 0.75 + stats.good * 0.5) / total) * 100
      : 100;
    const accStr = accNum.toFixed(2);

    let rank = 'B';
    if (accNum >= 99.5 && stats.miss === 0) rank = 'SSS+';
    else if (accNum >= 98.0) rank = 'SSS';
    else if (accNum >= 95.0) rank = 'SS';
    else if (accNum >= 90.0) rank = 'S';
    else if (accNum >= 80.0) rank = 'A';

    const banner = document.getElementById('clearBanner');
    banner.className = 'rank-tag';
    if (total > 0 && stats.perfect === total) {
      banner.textContent = '✦ ALL PERFECT // 理论值神迹 ✦';
      banner.classList.add('ap');
    } else if (total > 0 && stats.miss === 0) {
      banner.textContent = '★ FULL COMBO // 全连通关 ★';
      banner.classList.add('fc');
    } else {
      banner.textContent = '◆ TRACK COMPLETE // 演奏达成 ◆';
      banner.classList.add('clear');
    }

    document.getElementById('resRankLetter').textContent = rank;
    document.getElementById('resTotalScore').textContent = Math.floor(score).toLocaleString();
    document.getElementById('resSubTitle').textContent = `MAX COMBO ${maxCombo} ｜ ACCURACY ${accStr}%`;
    document.getElementById('resPerf').textContent = stats.perfect;
    document.getElementById('resGreat').textContent = stats.great;
    document.getElementById('resGood').textContent = stats.good;
    document.getElementById('resMiss').textContent = stats.miss;

    spawnCelebrationConfetti();
    statusText.textContent = `♪ ${currentTrackName} [${difficulty.toUpperCase()}] 演奏完成`;
    resultCard.style.display = 'block';
    go('result');
  }

  // ==========================================
  // 输入判定与粒子冲击波
  // ==========================================
  function handleLaneDown(lane) {
    lanePressed[lane] = true;
    laneFlash[lane] = 1.0;
    if (!isPlaying) return;

    const currentTime = audioCtx.currentTime - startTime;
    let target = null;
    let minDiff = Infinity;

    for (const note of notes) {
      if (note.lane === lane && !note.hit && !note.missed) {
        const diff = currentTime - note.time;
        if (Math.abs(diff) <= WIN_GOOD && Math.abs(diff) < Math.abs(minDiff)) {
          minDiff = diff;
          target = note;
        }
      }
    }

    if (target) {
      const absDiff = Math.abs(minDiff);
      target.hit = true;
      if (target.duration > 0) target.holding = true;

      const timingHint = absDiff <= 0.022 ? '' : (minDiff < 0 ? 'EARLY' : 'LATE');
      const isFever = combo >= 25;
      const mult = isFever ? 1.5 : 1.0;

      if (absDiff <= WIN_PERFECT) {
        stats.perfect++;
        combo++;
        score += 1000 * mult;
        beatPulse = 1.0;
        showJudge('PERFECT', timingHint, '#7afcff');
        spawnHitFX(lane, 26, '#7afcff');
      } else if (absDiff <= WIN_GREAT) {
        stats.great++;
        combo++;
        score += 700 * mult;
        beatPulse = 0.6;
        showJudge('GREAT', timingHint, '#ffd166');
        spawnHitFX(lane, 15, '#ffd166');
      } else {
        stats.good++;
        combo++;
        score += 400 * mult;
        showJudge('GOOD', timingHint, '#c77dff');
        spawnHitFX(lane, 9, '#c77dff');
      }

      maxCombo = Math.max(maxCombo, combo);
      triggerHitSound(lane);
      updateHUD();
    }
  }

  function handleLaneUp(lane) {
    lanePressed[lane] = false;
    if (!isPlaying) return;

    const currentTime = audioCtx.currentTime - startTime;
    for (const note of notes) {
      if (note.lane === lane && note.holding) {
        note.holding = false;
        const endTime = note.time + note.duration;
        if (Math.abs(currentTime - endTime) <= WIN_GOOD) {
          score += 500;
          spawnHitFX(lane, 16, '#ffd166');
          updateHUD();
        }
      }
    }
  }

  function showJudge(text, sub, color) {
    lastJudge = { text, sub, color, alpha: 1.0, scale: 1.38 };
  }

  function spawnHitFX(lane, count, color) {
    const cx = trackLeft + lane * laneWidth + laneWidth / 2;
    shockwaves.push({ x: cx, y: hitY, radius: 10, maxRadius: laneWidth * 1.05, color, alpha: 0.95 });

    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.45;
      const speed = 130 + Math.random() * 290;
      particles.push({
        x: cx,
        y: hitY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 70,
        size: 2.5 + Math.random() * 3.5,
        color,
        alpha: 1.0
      });
    }
  }

  function updateHUD() {
    scoreVal.textContent = String(Math.floor(score)).padStart(7, '0');
    const total = stats.perfect + stats.great + stats.good + stats.miss;
    const acc = total > 0
      ? (((stats.perfect * 1 + stats.great * 0.75 + stats.good * 0.5) / total) * 100).toFixed(2)
      : '100.00';
    accVal.textContent = `${acc}%`;

    if (combo >= 25) {
      feverBadge.textContent = '✦ FEVER x1.5 ✦';
      feverBadge.style.opacity = '1';
    } else {
      feverBadge.textContent = `FEVER (${combo}/25)`;
      feverBadge.style.opacity = '0.55';
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'Escape' && screen === 'play') { quitSong(); return; }
    if (screen === 'title' && (e.code === 'Enter' || e.code === 'Space')) { go('select'); return; }
    const idx = KEYS.indexOf(e.code);
    if (idx !== -1) handleLaneDown(idx);
  });

  window.addEventListener('keyup', (e) => {
    const idx = KEYS.indexOf(e.code);
    if (idx !== -1) handleLaneUp(idx);
  });

  function getLaneFromX(x, y) {
    const hz = height * 0.13, pmin = 1 / 3.53;
    const p = pmin + Math.min(1, Math.max(0, (y - hz) / (hitY - hz))) * (1 - pmin);
    const rel = (x - width / 2) / p;
    if (Math.abs(rel) > trackWidth / 2) return -1;
    return Math.floor(rel / laneWidth + LANES / 2);
  }

  canvas.addEventListener('pointerdown', (e) => {
    const lane = getLaneFromX(e.clientX, e.clientY);
    if (lane !== -1) handleLaneDown(lane);
  });

  canvas.addEventListener('pointerup', (e) => {
    const lane = getLaneFromX(e.clientX, e.clientY);
    if (lane !== -1) handleLaneUp(lane);
  });

  // ==========================================
  // 极简黑胶唱机与白色机械唱臂渲染引擎
  // ==========================================
  function drawVinylTurntable(dt) {
    const targetArm = isPlaying ? 1 : 0;
    tonearmProgress += (targetArm - tonearmProgress) * Math.min(1, dt * 5.5);

    const spinSpeed = 0.42 * tonearmProgress + 0.03 * (1 - tonearmProgress);
    vinylAngle = (vinylAngle + spinSpeed * dt) % (Math.PI * 2);
    beatPulse *= 0.88;

    const r = vinylRadius * (1 + beatPulse * 0.022);
    const cx = vinylCenterX;
    const cy = vinylCenterY;

    ctx.save();

    // 1. 唱机底盘托盘环
    ctx.beginPath();
    ctx.arc(cx, cy, r * 1.11, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 250, 240, 0.05)';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(255, 250, 240, 0.1)';
    ctx.stroke();

    // 2. 旋转的黑胶唱片本体
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(vinylAngle);

    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = '#0a0a0b';
    ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
    ctx.shadowBlur = 28;
    ctx.shadowOffsetY = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    // 细腻同心圆音轨沟槽
    const labelRadius = r * 0.56;
    for (let gr = labelRadius + 6; gr < r - 4; gr += 4.5) {
      ctx.beginPath();
      ctx.arc(0, 0, gr, 0, Math.PI * 2);
      ctx.strokeStyle = gr % 9 < 4.5 ? 'rgba(255,255,255,0.035)' : 'rgba(0,0,0,0.45)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // 十字对角黑胶高光反光
    const sheenGrad = ctx.createConicGradient(0.4, 0, 0);
    sheenGrad.addColorStop(0.00, 'rgba(255,255,255,0)');
    sheenGrad.addColorStop(0.08, 'rgba(255,255,255,0.07)');
    sheenGrad.addColorStop(0.16, 'rgba(255,255,255,0)');
    sheenGrad.addColorStop(0.50, 'rgba(255,255,255,0)');
    sheenGrad.addColorStop(0.58, 'rgba(255,255,255,0.07)');
    sheenGrad.addColorStop(0.66, 'rgba(255,255,255,0)');
    sheenGrad.addColorStop(1.00, 'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.98, 0, Math.PI * 2);
    ctx.fillStyle = sheenGrad;
    ctx.fill();

    // 3. 中央圆形专辑封面 (来自 Lucent.mp3 内嵌封面)
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, labelRadius, 0, Math.PI * 2);
    ctx.clip();

    if (vinylImg.complete && vinylImg.naturalWidth > 0) {
      ctx.drawImage(vinylImg, -labelRadius, -labelRadius, labelRadius * 2, labelRadius * 2);
    } else {
      ctx.fillStyle = '#e8e2d5';
      ctx.fillRect(-labelRadius, -labelRadius, labelRadius * 2, labelRadius * 2);
    }
    ctx.restore();

    ctx.beginPath();
    ctx.arc(0, 0, labelRadius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.restore();

    // 4. 右上方白色机械唱臂
    const pivotX = cx + r * 0.16;
    const pivotY = cy - r * 1.48;

    ctx.beginPath();
    ctx.arc(pivotX, pivotY, r * 0.115, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.fill();

    const restAngle = -0.34;
    const playAngle = 0.03;
    const armAngle = restAngle + (playAngle - restAngle) * tonearmProgress;

    ctx.save();
    ctx.translate(pivotX, pivotY);
    ctx.rotate(armAngle);

    ctx.shadowColor = 'rgba(0, 0, 0, 0.38)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 5;

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = Math.max(4, r * 0.034);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(r * 0.56, r * 0.52);
    ctx.lineTo(r * 0.96, r * 0.62);
    ctx.stroke();

    ctx.save();
    ctx.translate(r * 0.96, r * 0.62);
    ctx.rotate(0.24);
    ctx.fillStyle = '#ffffff';
    const headW = r * 0.22;
    const headH = Math.max(9, r * 0.075);
    ctx.beginPath();
    ctx.roundRect(-headW * 0.15, -headH / 2, headW, headH, 3);
    ctx.fill();

    ctx.strokeStyle = '#c8c4bc';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(headW * 0.52, -headH * 0.35);
    ctx.lineTo(headW * 0.52, headH * 0.35);
    ctx.stroke();
    ctx.restore();

    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.072, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, r * 0.024, 0, Math.PI * 2);
    ctx.fillStyle = '#8c857b';
    ctx.fill();

    ctx.restore();
    ctx.restore();
  }

  // ==========================================
  // 主渲染循环
  // ==========================================
  let lastFrame = performance.now();

  function render(now) {
    const dt = Math.min((now - lastFrame) / 1000, 0.05);
    lastFrame = now;

    const isFever = isPlaying && combo >= 25, cx = width / 2, T = now / 1000;
    const playing = screen === 'play';
    ctx.fillStyle = '#080a16';
    ctx.fillRect(0, 0, width, height);
    const bg = ctx.createRadialGradient(vinylCenterX, vinylCenterY, 20, vinylCenterX, vinylCenterY, Math.max(width, height) * 0.8);
    bg.addColorStop(0, isFever ? '#3a2250' : '#1a2350');
    bg.addColorStop(1, '#080a16');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, width, height);

    // 漂浮的玻璃碎片
    for (let i = 0; i < 9; i++) {
      const sx = ((i * 0.37 + T * 0.012 * (1 + i % 3)) % 1) * (width + 200) - 100, sy = (i * 0.61 % 1) * height, sz = 40 + i * 14;
      ctx.fillStyle = `rgba(150,190,255,${0.035 + (i % 3) * 0.015})`;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + sz, sy + sz * 0.4); ctx.lineTo(sx + sz * 0.3, sy + sz); ctx.fill();
    }

    ctx.save();
    ctx.globalAlpha = playing ? 0.2 : 1;
    drawVinylTurntable(dt);
    ctx.restore();

    if (!playing) {
      for (let k = 0; k < 3; k++) {
        const ph = (T * 0.22 + k / 3) % 1;
        ctx.strokeStyle = `rgba(160,210,255,${0.22 * (1 - ph)})`;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(vinylCenterX, vinylCenterY, vinylRadius * (1.15 + ph * 1.1), 0, 7); ctx.stroke();
      }
    }

    if (playing) {
      // 透视轨道：远处收窄，判定线在底部
      const hw = trackWidth / 2, Zm = 1.15, K = 2.2, pmin = 1 / (1 + Zm * K), hz = height * 0.13;
      const P = wd => { const p = 1 / (1 + Math.max(0, wd) / hitY * K); return { p, y: hz + (hitY - hz) * (p - pmin) / (1 - pmin) }; };
      const X = (rel, p) => cx + rel * p;

      const hg = ctx.createRadialGradient(cx, hz, 0, cx, hz, height * 0.4);
      hg.addColorStop(0, isFever ? 'rgba(255,120,190,.45)' : 'rgba(120,200,255,.4)');
      hg.addColorStop(1, 'transparent');
      ctx.fillStyle = hg;
      ctx.fillRect(0, 0, width, height * 0.6);

      const tg = ctx.createLinearGradient(0, hz, 0, hitY);
      tg.addColorStop(0, 'rgba(14,20,48,0)');
      tg.addColorStop(1, 'rgba(10,14,34,.82)');
      ctx.fillStyle = tg;
      ctx.beginPath();
      ctx.moveTo(cx - hw * pmin, hz); ctx.lineTo(cx + hw * pmin, hz); ctx.lineTo(cx + hw, hitY);
      ctx.lineTo(cx + hw, height); ctx.lineTo(cx - hw, height); ctx.lineTo(cx - hw, hitY);
      ctx.fill();

      for (let i = 0; i <= LANES; i++) {
        const rel = (i - LANES / 2) * laneWidth, edge = i === 0 || i === LANES;
        ctx.strokeStyle = edge ? (isFever ? '#ff8fc8' : '#bfe6ff') : 'rgba(190,220,255,.14)';
        ctx.lineWidth = edge ? 2 : 1;
        ctx.beginPath(); ctx.moveTo(X(rel, pmin), hz); ctx.lineTo(cx + rel, hitY); ctx.lineTo(cx + rel, height); ctx.stroke();
      }

      const far = P(hitY * 0.8);
      for (let i = 0; i < LANES; i++) {
        const l = (i - LANES / 2) * laneWidth;
        if (laneFlash[i] > 0.01) {
          const g2 = ctx.createLinearGradient(0, hitY, 0, far.y);
          g2.addColorStop(0, LANE_COLORS[i] + '66');
          g2.addColorStop(1, 'transparent');
          ctx.fillStyle = g2;
          ctx.beginPath();
          ctx.moveTo(cx + l, hitY); ctx.lineTo(cx + l + laneWidth, hitY);
          ctx.lineTo(X(l + laneWidth, far.p), far.y); ctx.lineTo(X(l, far.p), far.y);
          ctx.fill();
          if (!lanePressed[i]) laneFlash[i] *= 0.84;
        }
        ctx.fillStyle = lanePressed[i] ? LANE_COLORS[i] : 'rgba(190,220,255,.08)';
        ctx.beginPath(); ctx.roundRect(cx + l + 5, hitY + 16, laneWidth - 10, 46, 6); ctx.fill();
        ctx.fillStyle = lanePressed[i] ? '#0a0c16' : '#9fb4d6';
        ctx.font = '300 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(KEY_LABELS[i], cx + l + laneWidth / 2, hitY + 45);
      }

      // 判定线（Cytus 式发光扫描线）
      ctx.strokeStyle = isFever ? '#ff8fc8' : '#7fe3ff';
      ctx.lineWidth = 3;
      ctx.shadowColor = ctx.strokeStyle;
      ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.moveTo(cx - hw - 24, hitY); ctx.lineTo(cx + hw + 24, hitY); ctx.stroke();
      ctx.shadowBlur = 0;

      const ct = audioCtx.currentTime - startTime, spd = DIFF_CONFIG[difficulty].speed * speedMultiplier;
      progEl.style.transform = `scaleX(${Math.max(0, Math.min(1, ct / songDuration))})`;
      if (isPlaying && ct > songDuration) endGame();

      for (const note of notes) {
        if (isPlaying) {
          if (!note.hit && !note.missed && ct - note.time > WIN_GOOD) {
            note.missed = true; combo = 0; stats.miss++;
            showJudge('MISS', '', '#ff5964'); updateHUD();
          }
          if (note.holding) {
            if (ct >= note.time + note.duration) {
              note.holding = false; score += 450; spawnHitFX(note.lane, 14, '#ffd166'); updateHUD();
            } else {
              score += 650 * dt;
              if (Math.random() < 0.38) spawnHitFX(note.lane, 2, '#ffd166');
            }
          }
        }
        if ((note.hit && !note.holding) || note.missed) continue;

        const hd = (note.time - ct) * spd, td = hd + note.duration * spd;
        if (hd > hitY * Zm || td < -40) continue;
        const a = P(note.holding ? 0 : hd), b = P(Math.min(td, hitY * Zm));
        const l = (note.lane - LANES / 2) * laneWidth;
        const col = note.duration > 0 ? '#ffd166' : LANE_COLORS[note.lane];

        if (note.duration > 0) {
          ctx.fillStyle = 'rgba(255,209,102,.3)';
          ctx.beginPath();
          ctx.moveTo(X(l + 14, a.p), a.y); ctx.lineTo(X(l + laneWidth - 14, a.p), a.y);
          ctx.lineTo(X(l + laneWidth - 14, b.p), b.y); ctx.lineTo(X(l + 14, b.p), b.y);
          ctx.fill();
        }
        const w = (laneWidth - 12) * a.p, h = 8 + 16 * a.p, nx = X(l + laneWidth / 2, a.p) - w / 2;
        ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.roundRect(nx, a.y - h / 2, w, h, 4 * a.p + 1); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        ctx.beginPath(); ctx.roundRect(nx, a.y - h / 2, w, h * 0.4, 3 * a.p + 1); ctx.fill();
      }

      if (combo > 1) {
        ctx.fillStyle = 'rgba(210,230,255,.14)';
        ctx.font = '200 96px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(combo, cx, hitY - 210);
      }
      if (lastJudge.alpha > 0.01) {
        ctx.save();
        ctx.globalAlpha = lastJudge.alpha;
        ctx.translate(cx, hitY - 125);
        ctx.scale(lastJudge.scale, lastJudge.scale);
        ctx.fillStyle = lastJudge.color;
        ctx.font = '300 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(lastJudge.text, 0, 0);
        if (lastJudge.sub) { ctx.font = '300 12px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText(lastJudge.sub, 0, 18); }
        ctx.restore();
        lastJudge.alpha *= 0.91;
        lastJudge.scale += (1.0 - lastJudge.scale) * 0.26;
      }
    }

    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      sw.radius += (sw.maxRadius - sw.radius) * 0.24;
      sw.alpha *= 0.85;
      ctx.strokeStyle = sw.color;
      ctx.globalAlpha = sw.alpha;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      if (sw.alpha < 0.03) shockwaves.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 620 * dt;
      p.alpha *= 0.92;

      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      if (p.alpha < 0.04) particles.splice(i, 1);
    }

    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      c.vy += 450 * dt;
      c.vx *= 0.985;
      c.rot += c.vrot * dt;
      c.alpha *= 0.992;

      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      ctx.fillStyle = c.color;
      ctx.globalAlpha = c.alpha;
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.restore();

      if (c.y > height + 30 || c.alpha < 0.05) confetti.splice(i, 1);
    }

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
