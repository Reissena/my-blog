<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="color-scheme" content="dark">
  <title>KONBINI NIGHT — 拉面店 · 雪 · 昼夜</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <aside id="hud" class="hud" aria-label="场景控制">
    <div class="hud__title">
      <span class="hud__dot"></span> konbini night
      <a class="hud__back" href="https://yunblog.com.cn/store/" title="返回 SAKURA NIGHT 便利店">← 返回便利店</a>
    </div>

    <div class="hud__group">
      <span class="hud__label">时间</span>
      <div class="hud__seg" data-group="time">
        <button type="button" data-value="day">白天</button>
        <button type="button" data-value="dusk">黄昏</button>
        <button type="button" data-value="night" class="is-active">夜晚</button>
      </div>
    </div>

    <div class="hud__group">
      <span class="hud__label">天气</span>
      <div class="hud__seg" data-group="weather">
        <button type="button" data-value="clear">晴</button>
        <button type="button" data-value="rain" class="is-active">雨</button>
        <button type="button" data-value="snow">雪</button>
      </div>
    </div>

    <div class="hud__group hud__group--env">
      <span class="hud__label">环境</span>
      <button type="button" id="lampToggle" class="hud__toggle is-on" aria-pressed="true">路灯 <b>开</b></button>
      <button type="button" id="petalToggle" class="hud__toggle is-on" aria-pressed="true">樱花 <b>开</b></button>
    </div>

    <div class="hud__hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>
  </aside>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
