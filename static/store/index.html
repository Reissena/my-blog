<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05070f" />
<title>SAKURA NIGHT — 日式便利店雨夜街角</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23090d18'/%3E%3Cg fill='%23ffb7c5'%3E%3Ccircle cx='16' cy='9' r='4.2'/%3E%3Ccircle cx='22.5' cy='14' r='4.2'/%3E%3Ccircle cx='20' cy='21' r='4.2'/%3E%3Ccircle cx='12' cy='21' r='4.2'/%3E%3Ccircle cx='9.5' cy='14' r='4.2'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23ff8fab'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="可交互的 3D 日式便利店街角"></canvas>
  <div class="atmosphere" aria-hidden="true"></div>

  <header class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="22" height="22">
        <g fill="currentColor" opacity=".95">
          <circle cx="16" cy="8" r="4.4"/><circle cx="23" cy="13" r="4.4"/>
          <circle cx="20.6" cy="21" r="4.4"/><circle cx="11.4" cy="21" r="4.4"/>
          <circle cx="9" cy="13" r="4.4"/>
        </g>
        <circle cx="16" cy="15.6" r="2.5" fill="#ff7d97"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1>SAKURA NIGHT</h1>
      <p>Japanese convenience store · rain, snow &amp; blossoms</p>
    </div>
  </header>

  <!-- 左上角返回博客首页 -->
  <a class="back-link" href="https://yunblog.com.cn/" title="返回东方夜话_Yunx站首页">&larr; 返回</a>

  <!-- 天气面板收起后留在左边缘的竖把手（点它 / 鼠标移上去就滑出来） -->
  <button class="panel-handle is-hidden" id="weatherHandle" type="button"
    aria-controls="weatherPanel" aria-expanded="true" aria-label="展开「天气与时间」面板">
    <span class="panel-handle-icon" id="handleWeatherIcon" aria-hidden="true">🌧️</span>
    <span class="panel-handle-bar" aria-hidden="true"></span>
    <span class="panel-handle-arrow" aria-hidden="true">›</span>
  </button>

  <section class="panel weather-panel" id="weatherPanel" aria-label="天气与时间">
    <div class="panel-head">
      <span class="panel-title">WEATHER &amp; TIME</span>
      <span class="panel-live" id="liveTag">NIGHT · RAIN</span>
    </div>

    <div class="weather-grid" role="group" aria-label="天气">
      <button class="chip" data-weather="sunny" type="button">
        <span class="chip-emoji">☀️</span><span class="chip-label">晴天<em>Sunny</em></span>
      </button>
      <button class="chip" data-weather="rainy" type="button">
        <span class="chip-emoji">🌧️</span><span class="chip-label">雨天<em>Rainy</em></span>
      </button>
      <button class="chip" data-weather="storm" type="button">
        <span class="chip-emoji">⛈️</span><span class="chip-label">雷雨<em>Thunder</em></span>
      </button>
      <button class="chip" data-weather="snow" type="button">
        <span class="chip-emoji">❄️</span><span class="chip-label">雪天<em>Snowy</em></span>
      </button>
      <button class="chip chip-wide" data-weather="heavy" type="button">
        <span class="chip-emoji">🌪️</span><span class="chip-label">暴雨<em>Heavy rain</em></span>
      </button>
    </div>

    <div class="panel-divider"></div>

    <div class="time-grid" role="group" aria-label="时间">
      <button class="time-btn" data-time="day" type="button">白天<em>Day</em></button>
      <button class="time-btn" data-time="sunset" type="button">黄昏<em>Dusk</em></button>
      <button class="time-btn" data-time="night" type="button">夜晚<em>Night</em></button>
    </div>

    <div class="panel-divider"></div>

    <button class="switch-row" id="btn-car" type="button" aria-pressed="true">
      <span class="switch-label">
        <span class="switch-dot" aria-hidden="true"></span>
        车辆行驶<em>Vehicle motion</em>
      </span>
      <span class="switch" aria-hidden="true"><span class="knob"></span></span>
    </button>

    <button class="switch-row" id="btn-sound" type="button" aria-pressed="false">
      <span class="switch-label">
        <span class="switch-dot" aria-hidden="true"></span>
        雷声音效<em>Thunder audio</em>
      </span>
      <span class="switch" aria-hidden="true"><span class="knob"></span></span>
    </button>
  </section>

  <div class="toolbar" aria-label="视角与环境控制">
    <button class="tool" id="btn-reset" type="button" data-tip="重置视角" aria-label="重置视角">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 3v5h5"/></svg>
    </button>
    <button class="tool" id="btn-orbit" type="button" data-tip="自动旋转" aria-label="自动旋转" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="4.2"/><path d="M12 2.5v3M12 18.5v3"/><circle cx="12" cy="12" r="2.4"/></svg>
    </button>
    <button class="tool" id="btn-night" type="button" data-tip="雨夜模式" aria-label="雨夜模式" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 16.5H7a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.2a4.15 4.15 0 0 1-.5 8.3Z"/><path d="M8.5 19.2 7.6 21M12.4 19.2 11.5 21M16.3 19.2 15.4 21"/></svg>
    </button>
    <button class="tool" id="btn-shop" type="button" data-tip="店内灯光" aria-label="店内灯光" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5.95 1.2 1 2h5.2c.05-.8.4-1.5 1-2A6 6 0 0 0 12 3Z"/></svg>
    </button>
  </div>

  <div class="caption">
    <span class="caption-line" aria-hidden="true"></span>
    <p>A quiet corner in Japan<span class="caption-sub">24H · さくらマート</span></p>
  </div>

  <div class="hint" id="hint">拖动旋转 · 滚轮缩放 · 右键平移</div>

  <div class="boot" id="boot">
    <div class="boot-inner">
      <div class="boot-sakura" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <i></i>
      </div>
      <p class="boot-title">SAKURA NIGHT</p>
      <p class="boot-note" id="bootNote">正在搭建街角…</p>
      <div class="boot-bar"><i></i></div>
    </div>
  </div>

  <div class="fatal hidden" id="fatal">
    <div class="fatal-card">
      <h2>场景无法启动</h2>
      <p id="fatalMsg">未知错误</p>
      <pre id="fatalDetail"></pre>
      <p class="fatal-tip">请确认：1) 通过本地服务器打开（<code>node server.mjs</code>）；2) 浏览器已启用 WebGL；3) <code>vendor/</code> 目录完整。</p>
      <button id="fatalReload" type="button">重新加载</button>
    </div>
  </div>
</div>

<script>
  (function () {
    var boot = document.getElementById('boot');
    var fatal = document.getElementById('fatal');
    var msg = document.getElementById('fatalMsg');
    var detail = document.getElementById('fatalDetail');
    window.__showFatal = function (text, err) {
      msg.textContent = text || '未知错误';
      detail.textContent = err ? String((err && err.stack) || err) : '';
      fatal.classList.remove('hidden');
      boot.classList.add('hidden');
    };
    window.__hideBoot = function () {
      boot.classList.add('hidden');
    };
    document.getElementById('fatalReload').addEventListener('click', function () { location.reload(); });

    function webglOK() {
      try {
        var c = document.createElement('canvas');
        return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl')));
      } catch (e) { return false; }
    }
    if (location.protocol === 'file:') {
      window.__showFatal('当前是 file:// 打开方式，ES Module 无法加载。', '请在项目目录运行：node server.mjs  然后访问 http://127.0.0.1:5173');
    } else if (!webglOK()) {
      window.__showFatal('浏览器不支持 WebGL，无法渲染 3D 场景。', '请更新 Chrome / Edge，或在设置里开启硬件加速。');
    }
    window.addEventListener('error', function (e) {
      if (e && e.message && /Failed to fetch dynamically imported module|Importing a module script failed|Cannot find module/i.test(e.message)) {
        window.__showFatal('依赖模块加载失败（Three.js 本地文件缺失或被拦截）。', e.message);
      }
    });
    setTimeout(function () {
      if (!window.__APP_READY__ && fatal.classList.contains('hidden')) {
        window.__showFatal('场景初始化超时。', '可能是 Three.js 本地文件缺失，或浏览器禁用了 WebGL。');
      }
    }, 20000);
  })();
</script>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
