# ============================================================================
# Pages CMS 配置（https://pagescms.org）
# ----------------------------------------------------------------------------
# 作用：在网页后台里写文章、传图片，保存即提交到 GitHub 仓库，构建平台自动重新发布。
# 使用前提见 CMS-SETUP.md（需要先把仓库推到 GitHub，再安装 Pages CMS 的 GitHub App）。
#
# 语法要点（踩坑记录）：
#   · 字段类型里**没有** `list` 这种 type；要让某个字段可重复，是给它加
#     `list: true` 这个「属性」，例如 tags。
#   · 正文用 `type: rich-text` 且字段名必须是 `body`（Pages CMS 的保留名，
#     它对应 front matter 下面那段正文）。
#   · Hugo 用 YAML front matter（`---` 包起来），所以 format 写 yaml-frontmatter。
# ============================================================================

media:
  - name: images
    label: 图片
    # 上传的图片落到 Hugo 的 static/images/，于是公开路径就是 /images/xxx.jpg
    # （static/ 下的文件会被 Hugo 原样复制到 public/）
    input: static/images
    output: /images
    extensions: [jpg, jpeg, png, webp, gif, avif, svg]
    rename: safe

content:
  - name: posts
    label: 文章
    type: collection
    path: content/posts
    format: yaml-frontmatter
    # 新文章的文件名：2026-10-09-我的新标题.md（标题会被转成安全的 slug）
    filename: "{year}-{month}-{day}-{fields.title}.md"
    media: images
    view:
      fields: [title, date, draft, pinned, tags]
      primary: title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
        options:
          maxlength: 120

      - name: date
        label: 日期
        type: date
        required: true

      - name: draft
        label: 草稿（勾选后不会发布到线上）
        type: boolean
        default: false

      - name: pinned
        label: 置顶（勾选后固定在文章列表最前）
        type: boolean
        default: false

      - name: tags
        label: 标签（可加多个）
        type: string
        list: true
        required: false

      - name: summary
        label: 摘要（列表卡片上显示的一两句话）
        type: text
        required: false
        options:
          maxlength: 300

      # PaperMod 的封面写法是嵌套的 cover.image / cover.alt，
      # 所以这里用 object 字段（图片 + 描述 + 图注），写出来的 front matter 才能被主题认出来。
      - name: cover
        label: 封面图（可选）
        type: object
        required: false
        fields:
          - name: image
            label: 图片
            type: image
          - name: alt
            label: 图片描述（无障碍 / SEO）
            type: string
          - name: caption
            label: 图注
            type: string

      - name: body
        label: 正文
        type: rich-text
        options:
          media: images

  # 关于 / 公告页（content/about/index.md → /about/）
  # · 单文件（singleton）集合：整页就是这一个文件，后台左侧会出现「关于 / 公告」。
  # · ⚠️ 这一页同时是**首页作者卡里那颗公告小标签**的数据源，派生关系是：
  #       小标签右侧文案 ← summary
  #       小标签左侧小图 ← cover.image
  #       小标签点去哪   ← 这一页自己的网址
  #   所以只改这里一处，关于页和首页小标签一起更新，不用维护两个地方。
  # · ⚠️ 下面这些字段**必须写全**：Pages CMS 保存时会按 fields 重新拼 front matter，
  #   没在这里声明的键会被丢掉（源码 lib/schema.ts 的 deepMap 只遍历 fields）。
  #   因此这一页刻意**不用** front matter 里的 url / layout ——
  #   网址 /about/ 与所用模板都由 content/about/ 这个目录名决定，后台怎么存都丢不掉。
  # · ⚠️ 这里**没有**写集合级的 `media: images`（文章那个集合里有，属于历史写法）：
  #   用 Pages CMS 自己的配置校验器跑过，集合级的 media 已经不在它认识的键里
  #   （报 Unrecognized key: "media"）。要指定图床就写在字段的 options.media 上，
  #   见下面 cover.image —— 这是官方文档现在的写法。
  - name: about
    label: 关于 / 公告
    type: file
    path: content/about/index.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: 标题
        type: string
        required: true
        options:
          maxlength: 60

      - name: subtitle
        label: 副标题（标题下面的一句话，可以留空）
        type: string
        required: false
        options:
          maxlength: 120

      - name: summary
        label: 公告摘要（首页作者卡那个小标签右侧显示的就是这一行，太长会自动截断）
        type: text
        required: false
        options:
          maxlength: 300

      - name: cover
        label: 小标签左侧的小图（可选；不传就显示一个公告小图标）
        type: object
        required: false
        fields:
          - name: image
            label: 图片
            type: image
            options:
              media: images
          - name: alt
            label: 图片描述（无障碍 / SEO）
            type: string
          - name: caption
            label: 图注
            type: string

      - name: body
        label: 正文
        type: rich-text
        options:
          media: images

  # 技能 / 技术栈清单（页面 /skills/ 的内容全部读这个文件）
  # · data/skills.yaml 本身就是「分类数组」，所以这里用 type: file + list: true
  #   （list: true 用在 file 上 = 整个文件就是一个顶层数组，见 Pages CMS 文档的 List 一节）
  # · 分类、以及分类下的技术，都是可增删的：字段类型里没有 `list` 这种 type，
  #   要可重复是给字段加 `list` 这个属性 —— 对象也可以，写 list: true 或
  #   list: { min, max, collapsible } 都行。
  - name: skills
    label: 技能 / 技术栈
    type: file
    path: data/skills.yaml
    format: yaml
    list: true
    fields:
      - name: name
        label: 分类名
        type: string
        required: true

      - name: desc
        label: 分类说明（可选，显示在分类名旁边）
        type: string

      - name: items
        label: 这个分类下的技术（可加多个）
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{fields.name}"
        fields:
          - name: name
            label: 技术名字
            type: string
            required: true

          - name: desc
            label: 描述（一句话说清它是什么 / 在这个站里干什么）
            type: text
            required: true
            options:
              maxlength: 300

          - name: url
            label: 来源网站（官网链接，页面上会新标签页打开）
            type: string
            required: true
