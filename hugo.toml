# ============================================================
# Hugo 站点配置 —— PaperMod 主题 / 中文站点
# 部署后请把 baseURL 改成你的真实域名（或 Cloudflare Pages 分配的域名）
# ============================================================

# TODO: 上线后改成正式域名，例如 "https://blog.example.com/"
baseURL = "https://example.com/"
title = "我的个人博客"
theme = "PaperMod"

# 中文相关（Hugo 0.158+ 用 locale 取代 languageCode）
locale = "zh-CN"
defaultContentLanguage = "zh"
hasCJKLanguage = true
enableEmoji = true
enableRobotsTXT = true

# 分页（Hugo 0.128+ 的新写法，旧的 paginate 已废弃）
[pagination]
  pagerSize = 10

# 首页额外输出 JSON，供 PaperMod 的搜索页使用
[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark.renderer]
    # 允许在 Markdown 里直接写 HTML
    unsafe = true
  [markup.highlight]
    noClasses = false

[params]
  env = "production"
  description = "记录技术笔记与生活随笔的个人博客"
  keywords = ["博客", "Hugo", "PaperMod", "技术笔记"]
  author = "博主"

  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false

  # 文章页显示项
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  comments = false

  # 首页简介
  [params.homeInfoParams]
    Title = "你好，欢迎来到我的博客 👋"
    Content = "这里记录我的技术笔记、折腾过程和生活随笔。"

  # 社交图标（把 url 换成你自己的）
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/yourname"
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

# ============================================================
# 登录模块（前端门禁式，实现见 layouts/ + assets/js/auth.js）
# 完整说明与安全边界见 DEPLOY.md
#   1) 口令以 PBKDF2-SHA256 加盐哈希保存，配置里没有明文；
#   2) 换密码：node tools/hash-password.mjs --user member
#      然后把输出的 salt / hash / iterations 替换掉即可；
#   3) enabled = false 可一键关掉页头入口与门禁跳转。
# ============================================================
[params.auth]
  enabled = true
  sessionHours = 12         # 不勾「记住我」时的登录有效期（小时）
  rememberDays = 30         # 勾选「记住我」时的登录有效期（天）
  maxAttempts = 5           # 连续输错几次后进入冷却
  cooldownMs = 5000         # 冷却时长（毫秒）
  loginPath = "login/"      # 登录页路径（相对站点根，会自动拼上 baseURL 的子路径）
  membersPath = "private/"  # 会员栏目路径

# 测试账号 ①：member / papermod123
[[params.auth.users]]
  username = "member"
  displayName = "会员读者"
  salt = "30c9f894189e8cd23d3534b9a887aa36"
  hash = "21e6cdd6f69376ec51a44a3f709f6455fe5265342adee72d3ac05503c8694cdd"
  iterations = 150000

# 测试账号 ②：admin / admin@2026
[[params.auth.users]]
  username = "admin"
  displayName = "站长"
  salt = "d302732b3843682751f6d39aae70e9ed"
  hash = "f490c5dcc4f64993e88517d76247e24acb5a7989051974fc5e8c71e8315e6f09"
  iterations = 150000

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 40
