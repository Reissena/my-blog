# ============================================================
# Hugo 站点配置 —— PaperMod 主题 / 中文站点
# 站点：人间之里X东方夜话
# ============================================================

# 生产环境地址（结尾必须带斜杠）。
# 目前指向 Cloudflare 上的部署地址；绑定自定义域名后改成
#   baseURL = "https://blog.你的域名.com/"
# 改了以后记得重新构建，否则 canonical / sitemap / RSS 里的链接还是旧域名。
baseURL = "https://yunblog.com.cn/"
title = "人间之里X东方夜话"
theme = "PaperMod"

# 中文相关（Hugo 0.158+ 用 locale 取代 languageCode）
locale = "zh-CN"
defaultContentLanguage = "zh"
hasCJKLanguage = true
enableEmoji = true
enableRobotsTXT = true

# 首页/归档只列 posts 栏目：不显式指定的话，Hugo 会把「页数最多的栏目」当成主栏目。
mainSections = ["posts"]

# 分页（Hugo 0.128+ 的新写法，旧的 paginate 已废弃）
[pagination]
  pagerSize = 10

# 首页额外输出 JSON，供 PaperMod 的搜索页使用
[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark.renderer]
    # 允许在 Markdown 里直接写 HTML
    unsafe = true
  [markup.highlight]
    noClasses = false

[params]
  env = "production"
  description = "人间之里X东方夜话：记录技术笔记、折腾过程与生活随笔。"
  keywords = ["浮华Yun", "博客", "Hugo", "PaperMod", "技术笔记"]
  author = "浮华Yun"

  # 页脚状态栏「本站已稳定运行」的起始日期（北京时间当天 00:00 起算）。
  # 以后要改只动这一个字段，模板与脚本都从这里读。
  siteLaunchDate = "2026-09-30"

  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false

  # 文章页显示项
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  comments = false

  # 首页简介
  [params.homeInfoParams]
    Title = "浮华Yun"
    Content = "你好，我是浮华Yun 👋 这里记录我的技术笔记、折腾过程和生活随笔。 [暂时的静态网站]"

  # 社交图标（想加 GitHub / 邮箱等，按下面的格式追加即可；url 记得换成你自己的）
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

# ============================================================
# 登录模块（前端门禁式，实现见 layouts/ + assets/js/auth.js）
# 完整说明与安全边界见 DEPLOY.md
#   1) 口令以 PBKDF2-SHA256 加盐哈希保存，配置里没有明文；
#   2) 换密码 / 加账号：node tools/hash-password.mjs --user 用户名 --role member
#      然后把输出的 salt / hash / iterations 加进来即可（可多个账号）；
#   3) 访客走 /register/ 生成申请码，站长把 [[params.auth.users]] 片段粘到
#      这里即可开通 —— 纯静态站无法自助开户，属于「申请制」；
#   4) enabled = false 可一键关掉页头入口与门禁跳转。
# ============================================================
[params.auth]
  enabled = true
  sessionHours = 12         # 不勾「记住我」时的登录有效期（小时）
  rememberDays = 30         # 勾选「记住我」时的登录有效期（天）
  maxAttempts = 5           # 连续输错几次后进入冷却
  cooldownMs = 5000         # 冷却时长（毫秒）
  loginPath = "login/"      # 登录页路径（相对站点根，会自动拼上 baseURL 的子路径）
  registerPath = "register/" # 注册申请页路径
  membersPath = "private/"  # 会员栏目路径，对应 content/private/
  defaultIterations = 150000 # 注册页生成哈希时用的迭代次数

# ------------------------------------------------------------
# 用户列表：username / displayName / role / salt / hash / iterations
#   role 目前用于 role-gated 页面：front matter 里写 role = "admin"
#   的页面只有 admin 能进（member 会被弹回登录页并提示权限不足）。
#   role 只是「约定」，前端门禁终究挡不住改 localStorage 的人，见 DEPLOY.md。
# ------------------------------------------------------------

# 会员账号
#   （密码不在配置里，只有 PBKDF2 哈希；换密码见 DEPLOY.md §8.1）
[[params.auth.users]]
  username = "member"
  displayName = "会员读者"
  role = "member"
  salt = "e4240372fd909d9b60e3a4f80ce0586a"
  hash = "fd5f5652fd2296ceb700ac3b8a3f1d7ec74c2e87ef47261650c06e872abeb322"
  iterations = 150000

# 管理员账号
[[params.auth.users]]
  username = "admin"
  displayName = "站长"
  role = "admin"
  salt = "2980399bc09de4b301b6a1537ecb627b"
  hash = "fb48a44d5ce44e4ba2f815196a37443375df05f2900d0a5eed5ab0fa21b9422a"
  iterations = 150000

[menu]
  [[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 5
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
