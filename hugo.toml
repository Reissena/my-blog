# ============================================================
# Hugo 站点配置 —— PaperMod 主题 / 中文站点
# 部署后请把 baseURL 改成你的真实域名（或 Cloudflare Pages 分配的域名）
# ============================================================

# TODO: 上线后改成正式域名，例如 "https://blog.example.com/"
baseURL = "https://example.com/"
title = "我的个人博客"
theme = "PaperMod"

# 中文相关（Hugo 0.158+ 用 locale 取代 languageCode）
locale = "zh-CN"
defaultContentLanguage = "zh"
hasCJKLanguage = true
enableEmoji = true
enableRobotsTXT = true

# 分页（Hugo 0.128+ 的新写法，旧的 paginate 已废弃）
[pagination]
  pagerSize = 10

# 首页额外输出 JSON，供 PaperMod 的搜索页使用
[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark.renderer]
    # 允许在 Markdown 里直接写 HTML
    unsafe = true
  [markup.highlight]
    noClasses = false

[params]
  env = "production"
  description = "记录技术笔记与生活随笔的个人博客"
  keywords = ["博客", "Hugo", "PaperMod", "技术笔记"]
  author = "博主"

  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false

  # 文章页显示项
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  comments = false

  # 首页简介
  [params.homeInfoParams]
    Title = "你好，欢迎来到我的博客 👋"
    Content = "这里记录我的技术笔记、折腾过程和生活随笔。"

  # 社交图标（把 url 换成你自己的）
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/yourname"
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 40
